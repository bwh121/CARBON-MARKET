name: Deploy GitHub Pages

# 说明：本仓库 Pages 采用 build_type=legacy（从 main 分支 / 根目录构建），
# push 后由 GitHub 自动构建，无需 Actions 上传 artifact。
# 2026-11-25 起 GitHub Actions artifact 元数据接口持续故障（deploy-pages@v4 报
# "Found 0 artifact(s)"），故由 artifact 部署改为按需触发分支构建。
# 本工作流仅保留手动重建入口，可在 Actions 页 “Run workflow” 触发。

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request Pages build
        uses: actions/github-script@v7
        with:
          script: |
            const res = await github.request('POST /repos/{owner}/{repo}/pages/builds', {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            core.info(`Pages build queued: ${res.data.url}`);
